{% extends 'base.html' %}
{% block title %}Faculty Registration{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto mt-10 bg-white p-8 rounded-2xl shadow">
    <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">Faculty Registration</h2>

    {% if messages %}
        <div id="message-container" class="mb-4">
            {% for message in messages %}
                <div class="p-3 rounded text-white mb-2 transition-opacity duration-500
                    {% if message.tags == 'error' %}bg-red-500
                    {% elif message.tags == 'success' %}bg-green-500
                    {% else %}bg-blue-500{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        <input type="text" name="name" placeholder="Full Name" class="w-full p-2 border rounded" required>
        <input type="email" name="email" placeholder="Email" class="w-full p-2 border rounded" required>
        <input type="password" name="password1" placeholder="Password" class="w-full p-2 border rounded" required>
        <input type="password" name="password2" placeholder="Confirm Password" class="w-full p-2 border rounded" required>

        <h3 class="text-lg font-semibold mt-6 mb-2 text-gray-700 border-b pb-1">Profile Information</h3>

        <select name="department" class="w-full p-2 border rounded" required>
            <option value="" disabled selected>Select Department</option>
            <option value="EEE">EEE</option>
            <option value="CSE">CSE</option>
            <option value="BBA">BBA</option>
            <option value="MATH">MATH</option>
            <option value="CIVIL">CIVIL</option>
            <option value="Economics">Economics</option>
            <option value="English">English</option>
        </select>

        <select name="position" class="w-full p-2 border rounded" required>
            <option value="" disabled selected>Select Position</option>
            <option value="Lecturer">Lecturer</option>
            <option value="Assistant Professor">Assistant Professor</option>
            <option value="Professor">Professor</option>
            <option value="Chairman">Chairman</option>
            <option value="Vice-Chancellor">Vice-Chancellor</option>
            <option value="Dean">Dean</option>
        </select>

        <select name="office_building" class="w-full p-2 border rounded" required>
            <option value="" disabled selected>Select Building</option>
            <option value="B-1">B-1</option>
            <option value="B-2">B-2</option>
            <option value="B-3">B-3</option>
            <option value="B-4">B-4</option>
        </select>

        <input type="text" name="room_name" placeholder="Room Name" class="w-full p-2 border rounded" required>
        <input type="text" name="faculty_code" placeholder="Faculty Code" class="w-full p-2 border rounded" required>
        <input type="file" name="picture" class="w-full p-2 border rounded">

        <textarea name="academic_background" placeholder="Academic Background" class="w-full p-2 border rounded" required></textarea>
        <textarea name="experience" placeholder="Experience" class="w-full p-2 border rounded" required></textarea>
        <textarea name="biography" placeholder="Biography" class="w-full p-2 border rounded" required></textarea>

        <button type="submit" class="w-full bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
            Register
        </button>
    </form>
</div>

<script>
    setTimeout(() => {
        const container = document.getElementById('message-container');
        if (container) {
            container.style.opacity = '0';
            setTimeout(() => container.remove(), 500);
        }
    }, 5000);
</script>
{% endblock %}
