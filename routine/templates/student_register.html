{% extends 'base.html' %}
{% block title %}Student Registration{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto mt-10 bg-white p-8 rounded-2xl shadow">
    <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">Student Registration</h2>

    {% if messages %}
        <div id="message-container" class="mb-4">
            {% for message in messages %}
                <div class="p-3 rounded text-white mb-2 transition-opacity duration-500
                    {% if message.tags == 'error' %}bg-red-500
                    {% elif message.tags == 'success' %}bg-green-500
                    {% else %}bg-blue-500{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST" class="space-y-5">
        {% csrf_token %}

        <input type="text" name="student_name" placeholder="Full Name" required
            class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400">

        <input type="text" name="student_id" placeholder="Student ID" required
            class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400">

        <select name="department" required
            class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
            <option value="" disabled selected>Select Department</option>
            <option value="EEE">EEE</option>
            <option value="CSE">CSE</option>
            <option value="BBA">BBA</option>
            <option value="CIVIL">CIVIL</option>
            <option value="Economics">Economics</option>
            <option value="English">English</option>
        </select>

        <div class="grid grid-cols-2 gap-4">
            <input type="number" name="intake" placeholder="Intake" required
                class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400">

            <input type="text" name="section" placeholder="Section" required
                class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>

        <select name="blood_group" required
            class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
            <option value="" disabled selected>Select Blood Group</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
        </select>

        <input type="password" name="password1" placeholder="Password" required
            class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400">

        <input type="password" name="password2" placeholder="Confirm Password" required
            class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400">

        <button type="submit"
            class="w-full bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700 transition">
            Register
        </button>
    </form>
</div>


<script>
    setTimeout(() => {
        const container = document.getElementById('message-container');
        if (container) {
            container.style.opacity = '0';
            setTimeout(() => container.remove(), 500);
        }
    }, 5000);
</script>
{% endblock %}
